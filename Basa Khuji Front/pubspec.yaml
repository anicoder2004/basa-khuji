name: basa_khuji
description: "Basa Khuji - Bangladesh's trusted rental property platform"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Serialization
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Networking
  dio: ^5.5.0+1
  # retrofit: ^4.1.0  # Temporarily disabled due to generator bug with Dart 3.12

  # Routing
  go_router: ^14.2.0

  # Storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.2.3

  # Maps (using flutter_map + latlong2 for free OpenStreetMap)
  flutter_map: ^7.0.0
  latlong2: ^0.9.1

  # Media
  image_picker: ^1.1.2
  image_cropper: ^8.0.0
  flutter_image_compress: ^2.3.0
  cached_network_image: ^3.4.0

  # Firebase
  firebase_core: ^3.1.0
  firebase_messaging: ^15.0.0
  cloud_firestore: ^5.0.0

  # Notifications
  flutter_local_notifications: ^17.2.2

  # Background Location (commented for frontend-first dev)
  # background_locator_2: ^4.1.0

  # WebView (for SSLCommerz)
  webview_flutter: ^4.8.0

  # UI & Animation
  flutter_animate: ^4.5.0
  flutter_svg: ^2.0.10
  google_fonts: ^6.2.1
  shimmer: ^3.0.0

  # Utilities
  equatable: ^2.0.5
  path: ^1.9.0
  url_launcher: ^6.2.6
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  riverpod_generator: ^2.4.0
  riverpod_lint: ^2.3.10
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  # retrofit_generator: 8.0.0  # Temporarily disabled due to generator bug with Dart 3.12
  custom_lint: ^0.6.4

flutter:
  uses-material-design: true
  generate: true

  # Assets
  assets:
    - assets/images/
    - assets/icons/

  # Fonts: using google_fonts at runtime (NotoSans + NotoSansBengali).
  # Custom font files can be added later under assets/fonts/ and declared here.